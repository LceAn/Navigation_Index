<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>前往未知的网站 · LceAn</title>
<meta name="description" content="一键随机带你去看一个无聊但无害的网站。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<style>
:root{--paper:#f7f7f0;--paper-soft:#eeeee4;--surface:#fffef8;--ink:#263c35;--ink-soft:#64736b;--accent:#4e6c46;--accent-soft:#e7ecdf;--amber:#a28142;--line:#dfe3d7}
@media (prefers-color-scheme:dark){:root{--paper:#111d1b;--paper-soft:#172522;--surface:#1b2c27;--ink:#e7eade;--ink-soft:#afbcaf;--accent:#bed09d;--accent-soft:#283b2d;--amber:#d8bc7e;--line:#2c3e36}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:18px clamp(20px,5vw,48px);border-bottom:1px solid var(--line)}
header b{font-size:15px;letter-spacing:.06em}
header a{margin-left:auto;color:var(--ink-soft);text-decoration:none;font-size:13px}
header a:hover{color:var(--accent)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.box{max-width:560px;text-align:center}
h1{font-size:clamp(26px,4vw,36px);font-weight:600;letter-spacing:-.02em;margin:0 0 8px}
.sub{color:var(--ink-soft);font-size:14px;margin:0 0 36px}
button.go{cursor:pointer;font:inherit;font-size:19px;letter-spacing:.05em;padding:20px 44px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--paper);transition:transform .15s,box-shadow .15s}
button.go:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(23,43,36,.16)}
button.go:active{transform:translateY(0)}
.hint{font-size:12.5px;color:var(--ink-soft);margin-top:18px}
.last{margin-top:34px;font-size:13.5px;color:var(--ink-soft);min-height:24px}
.last a{color:var(--amber);text-decoration:none;border-bottom:1px dashed var(--amber)}
.count{position:fixed;right:18px;bottom:16px;font-size:12px;color:var(--ink-soft)}
footer{padding:22px;text-align:center;color:var(--ink-soft);font-size:12.5px;border-top:1px solid var(--line)}
footer a{color:var(--ink-soft)}
</style>
</head>
<body>
<header><b>LceAn · Zd</b><a href="https://www.lcean.com/">返回导航 →</a></header>
<main>
  <div class="box">
    <h1>前往未知的网站</h1>
    <p class="sub">无聊但无害的角落，随机抽一个。祝你好运。</p>
    <button class="go" id="go" type="button">带我去 🎲</button>
    <p class="hint">每次都是新网站，不会连续重复</p>
    <p class="last" id="last">还没出发过…</p>
  </div>
</main>
<div class="count" id="count"></div>
<footer><a href="https://www.lcean.com/">www.lcean.com</a> · 数字花园工具页</footer>
<script>
(function () {
  var sites = [
    { n: '鳗鱼拍脸', u: 'https://eelslap.com/' },
    { n: '手指指着你', u: 'https://pointerpointer.com/' },
    { n: '无穷的嗷~', u: 'https://hooooooooo.com/' },
    { n: '考拉放大镜', u: 'https://www.koalastothemax.com/' },
    { n: '芒果共和国', u: 'http://www.republiquedesmangues.fr/' },
    { n: '无尽下落', u: 'https://www.fallingfalling.com/' },
    { n: 'jodi 乱码艺术', u: 'http://wwwwwwwww.jodi.org/' },
    { n: '我的电脑开着吗', u: 'http://www.ismycomputeron.com/' },
    { n: '黑客键盘', u: 'https://hackertyper.com/' },
    { n: '无限缩放画', u: 'https://zoomquilt.org/' },
    { n: '长狗挑战', u: 'https://longdogechallenge.com/' },
    { n: '弹跳猫', u: 'https://www.catbounce.com/' },
    { n: '动完再想', u: 'https://www.movenowthinklater.com/' }
  ];
  var lastIdx = -1, count = 0;
  var lastEl = document.getElementById('last'), countEl = document.getElementById('count');
  document.getElementById('go').addEventListener('click', function () {
    var i;
    do { i = Math.floor(Math.random() * sites.length); } while (i === lastIdx && sites.length > 1);
    lastIdx = i; count++;
    lastEl.innerHTML = '第 ' + count + ' 站：<a href="' + sites[i].u + '" target="_blank" rel="noopener">' + sites[i].n + '</a>';
    countEl.textContent = '已探索 ' + count + ' 个无聊网站';
    window.open(sites[i].u, '_blank', 'noopener');
  });
})();
</script>
</body>
</html>
